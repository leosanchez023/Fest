<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06152f">
  <title>LOCAGEST | Entrar</title>
  <link rel="stylesheet" href="/img/img%20fest/locagest-colors.css">
  <link rel="stylesheet" href="/css/pages/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-showcase" aria-labelledby="showcase-title">
      <div class="login-showcase__decoration" aria-hidden="true">
        <span class="login-showcase__shape login-showcase__shape--one"></span>
        <span class="login-showcase__shape login-showcase__shape--two"></span>
        <span class="login-showcase__shape login-showcase__shape--three"></span>
        <span class="login-showcase__wave"></span>
      </div>

      <header class="showcase-brand" aria-label="LOCAGEST, Gestão inteligente para locação e venda">
        <img class="showcase-brand__logo" src="/img/img%20fest/locagest-logo-horizontal.png" alt="LOCAGEST. Gestão inteligente para locação e venda">
      </header>

      <div class="showcase-copy">
        <h1 id="showcase-title">Sua empresa de locação<br class="desktop-break"> e venda <span>em um só lugar.</span></h1>
        <p>Organize seus pedidos, controle seu estoque, acompanhe entregas e muito mais. Tudo de forma simples, rápida e eficiente.</p>
      </div>

      <footer class="showcase-footer">LOCAGEST <span aria-hidden="true">•</span> MAIS ORGANIZAÇÃO <span aria-hidden="true">•</span> MAIS RESULTADOS</footer>
    </section>

    <section class="login-panel" aria-label="Acesso à sua conta">
      <div class="login-card">
        <header class="login-card__header">
          <img class="login-card__logo" src="/img/img%20fest/locagest-logo-vertical.png" alt="LOCAGEST. Gestão inteligente para locação e venda">
        </header>

        <form action="/login" method="post" class="login-form" id="loginForm">
          <div class="form-group">
            <label for="email">E-mail ou usuário</label>
            <div class="input-wrapper">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
              <input type="text" name="email" id="email" placeholder="E-mail ou usuário" autocomplete="username" required>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" name="senha" id="password" placeholder="Senha" autocomplete="current-password" required>
              <button type="button" class="toggle-pass" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>


          <div class="form-options">
            <label class="remember-option"><input type="checkbox"> <span>Lembrar-me</span></label>
          </div>

          <button type="submit" class="submit-button" id="submitBtn">
            <span>Entrar</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
        </form>

        <div class="login-divider" role="separator" aria-label="ou"><span>ou</span></div>

        <div class="secure-note">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Acesso seguro</span>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
