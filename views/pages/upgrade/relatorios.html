<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fest · Relatórios</title>
<style>
  :root{
    --bg:#f4f5fb; --card:#fff; --ink:#1d1f2b; --muted:#6b7084; --line:#e6e8f2;
    --side:#1b1633; --side-ink:#c9c6e0;
    --brand:#6d4aff; --brand-2:#ff5c8a; --ok:#1fa971; --warn:#e8a317; --bad:#e5484d; --info:#2f7cf6;
    --radius:14px; --shadow:0 1px 2px rgba(20,20,50,.05),0 6px 20px rgba(20,20,50,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px}
  button,input,select{font:inherit;color:inherit}

  /* Sidebar */
  .sidebar{width:236px;background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;color:#fff;font-weight:700;font-size:21px;letter-spacing:.3px}
  .logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-style:normal;font-size:18px}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500;margin-bottom:2px}
  .nav a:hover{background:rgba(255,255,255,.07)}
  .nav a.active{background:linear-gradient(135deg,var(--brand),#8a6bff);color:#fff;box-shadow:0 6px 16px rgba(109,74,255,.35)}
  .nav span.ic{width:20px;text-align:center}
  .side-foot{margin-top:auto;padding:12px;font-size:12px;opacity:.6}

  /* Main */
  .main{flex:1;min-width:0;padding:26px 30px 50px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .topbar h1{font-size:26px;letter-spacing:-.3px}
  .topbar p{color:var(--muted);margin-top:2px}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#5a39e6;color:#fff}
  .menu-toggle{display:none}

  /* Tabs */
  .tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:12px;box-shadow:var(--shadow);width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
  .tab{border:0;background:transparent;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--ink);color:#fff}

  /* Filters */
  .filters{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .field input,.field select{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:9px;min-width:150px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,74,255,.15)}
  .field select:disabled{background:#f1f2f8;color:#a0a4b8}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip.active{background:rgba(109,74,255,.1);border-color:var(--brand);color:var(--brand)}
  .grow{flex:1;min-width:200px}
  .grow input{width:100%}
  .note{font-size:12px;color:var(--muted);margin:-8px 0 14px;display:none}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
  .kpi .l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .kpi .v{font-size:26px;font-weight:750;margin:6px 0 4px;letter-spacing:-.5px}
  .kpi .d{font-size:12.5px;color:var(--muted)}
  .up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}

  /* Charts */
  .charts{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:18px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card h3{font-size:15px;margin-bottom:14px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:210px;padding-top:10px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
  .bar div{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--brand),#a58cff);transition:height .4s;min-height:2px}
  .bar div:hover{filter:brightness(1.1)}
  .bar small{font-size:10px;color:var(--muted);margin-top:6px;height:14px;white-space:nowrap}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0}
  .donut::after{content:attr(data-total);position:absolute;inset:26px;background:var(--card);border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:15px;text-align:center;line-height:1.2}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1;min-width:130px}
  .legend div{display:flex;align-items:center;gap:8px}
  .legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .legend b{margin-left:auto;padding-left:10px}
  .hbars{display:flex;flex-direction:column;gap:11px}
  .hbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .hbar .tr{height:9px;background:#eef0f8;border-radius:99px;overflow:hidden}
  .hbar .tr div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  .empty{color:var(--muted);padding:30px 0;text-align:center}

  /* Table */
  .table-card{padding:0;overflow:hidden}
  .table-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;gap:10px;flex-wrap:wrap}
  .table-head h3{margin:0}
  .table-head span{color:var(--muted);font-size:13px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{background:#f8f9fd;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:11px 18px;cursor:pointer;user-select:none;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  th:hover{color:var(--brand)}
  th .ar{opacity:.5;margin-left:4px}
  td{padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr:hover{background:#faf9ff}
  .r{text-align:right}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
  .b-ok{background:#e3f7ee;color:#127a52}.b-info{background:#e3eeff;color:#1d5fc9}
  .b-warn{background:#fdf1d6;color:#9a6a00}.b-bad{background:#fde5e6;color:#b4282d}.b-def{background:#eef0f8;color:#555a73}
  .pager{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:var(--muted);font-size:13px;gap:10px;flex-wrap:wrap}
  .pager div{display:flex;gap:6px}
  .pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
  .pager button:disabled{opacity:.4;cursor:default}
  .print-head{display:none}

  @media(max-width:1000px){.charts{grid-template-columns:1fr}}
  @media(max-width:860px){
    .sidebar{position:fixed;z-index:20;left:-250px;transition:left .25s}
    .sidebar.open{left:0}
    .menu-toggle{display:inline-flex}
    .main{padding:18px 16px 40px}
  }
  @media print{
    .sidebar,.filters,.actions,.tabs,.pager,.menu-toggle,.note{display:none!important}
    body{background:#fff}.main{padding:0}
    .card,.kpi{box-shadow:none;border:1px solid #ddd}
    .print-head{display:block;margin-bottom:12px;color:#555}
    .charts{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo"><i>🎉</i> Fest</div>
  <nav class="nav">
    <a href="#"><span class="ic">📊</span> Dashboard</a>
    <a href="#"><span class="ic">📑</span> Pedidos</a>
    <a href="#"><span class="ic">👥</span> Clientes</a>
    <a href="#"><span class="ic">📦</span> Produtos</a>
    <a href="#"><span class="ic">🚚</span> Entregas</a>
    <a href="#"><span class="ic">💰</span> Financeiro</a>
    <a href="#"><span class="ic">🏢</span> Fornecedores</a>
    <a href="#" class="active"><span class="ic">📈</span> Relatórios</a>
    <a href="#"><span class="ic">👤</span> Usuários</a>
  </nav>
  <div class="side-foot">Prévia · dados fictícios</div>
</aside>

<main class="main">
  <div class="topbar">
    <div style="display:flex;gap:12px;align-items:center">
      <button class="btn menu-toggle" id="menuBtn" aria-label="Menu">☰</button>
      <div>
        <h1>Relatórios</h1>
        <p id="subtitle">Acompanhe o desempenho da sua empresa</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btnPrint">🖨️ Imprimir / PDF</button>
      <button class="btn primary" id="btnCsv">⬇️ Exportar CSV</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="filters">
    <div class="field">
      <label>Período rápido</label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="field"><label for="from">De</label><input type="date" id="from"></div>
    <div class="field"><label for="to">Até</label><input type="date" id="to"></div>
    <div class="field"><label for="status" id="statusLabel">Situação</label>
      <select id="status"></select>
    </div>
    <div class="field grow"><label for="q">Buscar</label><input type="search" id="q" placeholder="Cliente, produto, número..."></div>
  </div>
  <div class="note" id="note"></div>

  <div class="print-head" id="printHead"></div>

  <section class="kpis" id="kpis"></section>
  <section class="charts" id="charts"></section>

  <section class="card table-card">
    <div class="table-head"><h3 id="tableTitle">Detalhamento</h3><span id="count"></span></div>
    <div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="pager">
      <span id="pageInfo"></span>
      <div><button id="prev">← Anterior</button><button id="next">Próxima →</button></div>
    </div>
  </section>
</main>

<script>
/* ============ Dados fictícios (na versão real, virão do MySQL via API) ============ */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = rng(2026);
const pick = a => a[Math.floor(rand()*a.length)];
const weighted = (items) => { let x=rand(), acc=0; for (const [v,w] of items){acc+=w; if(x<acc) return v;} return items[0][0]; };

const CLIENTES = [
  ['Ana Paula Ribeiro','PF'],['Buffet Estrela do Sul','PJ'],['Carlos Eduardo Lima','PF'],['Doce Encanto Eventos','PJ'],
  ['Fernanda Martins','PF'],['Igreja Batista Central','PJ'],['João Pedro Souza','PF'],['Luciana Prado','PF'],
  ['Escola Pequeno Príncipe','PJ'],['Marcos Vinícius Alves','PF'],['Patrícia Gomes','PF'],['Salão Festa Real','PJ'],
  ['Renata Oliveira','PF'],['Tiago Nogueira','PF'],['Clube Atlético Tupã','PJ'],['Vanessa Cardoso','PF']
].map(([nome,tipo])=>({nome,tipo}));

const PRODUTOS = [
  ['Mesa redonda 8 lugares','Mobiliário',60,45],['Cadeira Tiffany','Mobiliário',300,6],['Toalha branca 3m','Têxtil',90,18],
  ['Jogo de pratos (12)','Louças',70,35],['Taças de cristal (12)','Louças',50,30],['Painel redondo','Decoração',25,80],
  ['Arranjo de flores','Decoração',40,55],['Caixa de som 500W','Som e luz',12,150],['Refletor LED','Som e luz',30,40],
  ['Pula-pula','Brinquedos',6,200],['Piscina de bolinhas','Brinquedos',8,120],['Cama elástica','Brinquedos',5,160],
  ['Churrasqueira','Equipamentos',10,90],['Freezer horizontal','Equipamentos',14,100],['Tenda 5x5','Estruturas',18,170],['Balões (pacote)','Consumíveis',200,25]
].map(([nome,categoria,estoque,preco])=>({nome,categoria,estoque,preco,alugados:Math.floor(rand()*estoque*0.7)}));

const BAIRROS = ['Centro','Jardim Aeroporto','Vila Nova','Jardim Primavera','Parque Industrial','Santa Luzia','Cohab'];
const FORMAS = ['Pix','Cartão','Dinheiro','Boleto'];
const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const ORDERS = [];
for (let i=1;i<=170;i++){
  const ago = Math.floor(Math.pow(rand(),1.25)*365);
  const date = addDays(HOJE,-ago);
  const cli = pick(CLIENTES);
  const status = weighted([['Concluído',.6],['Em andamento',.18],['Orçamento',.12],['Cancelado',.10]]);
  const valor = Math.round((160+rand()*2900)/5)*5;
  const forma = pick(FORMAS);
  let fin;
  if (status==='Concluído') fin = rand()<.9?'Pago':'Atrasado';
  else if (status==='Em andamento') fin = rand()<.5?'Parcial':'Pendente';
  else if (status==='Cancelado') fin = 'Cancelado';
  else fin = 'Pendente';
  if (fin==='Pendente' && ago>25) fin='Atrasado';
  let ent;
  if (status==='Concluído') ent='Concluída';
  else if (status==='Em andamento') ent = rand()<.5?'Agendada':'Em rota';
  else ent = status==='Cancelado'?'Cancelada':'Aguardando';
  ORDERS.push({
    num: 1000+i, date, cliente:cli.nome, cliTipo:cli.tipo,
    tipo: rand()<.78?'Locação':'Venda', status, valor, forma, fin,
    entTipo: rand()<.55?'Entrega':'Retirada', bairro: pick(BAIRROS), ent
  });
}
ORDERS.sort((a,b)=>b.date-a.date);

/* ============ Utilitários ============ */
const $ = s => document.querySelector(s);
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlShort = v => v>=1000 ? 'R$ '+(v/1000).toFixed(1).replace('.',',')+' mil' : brl(v);
const fdate = d => d.toLocaleDateString('pt-BR');
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseIso = s => new Date(s+'T00:00:00');
const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);
const COLORS = ['#6d4aff','#ff5c8a','#2f7cf6','#1fa971','#e8a317','#8a6bff','#14b8c6','#e5484d'];
const BADGE = {'Concluído':'ok','Pago':'ok','Concluída':'ok','Entregue':'ok','Em andamento':'info','Agendada':'info','Em rota':'info','Parcial':'info',
  'Orçamento':'warn','Pendente':'warn','Aguardando':'warn','Cancelado':'bad','Cancelada':'bad','Atrasado':'bad'};
const badge = t => `<span class="badge b-${BADGE[t]||'def'}">${t}</span>`;
const valid = o => o.status==='Concluído'||o.status==='Em andamento';
const groupCount = (rows,f)=>{const m={};rows.forEach(r=>{const k=f(r);m[k]=(m[k]||0)+1});return Object.entries(m).map(([label,value])=>({label,value}))};
const groupSum = (rows,f,v)=>{const m={};rows.forEach(r=>{const k=f(r);m[k]=(m[k]||0)+v(r)});return Object.entries(m).map(([label,value])=>({label,value}))};

/* ============ Definição de cada relatório ============ */
function timeSeries(rows, valueFn, from, to){
  const days = Math.round((to-from)/864e5)+1;
  const byDay = days<=45;
  const m = new Map();
  if (byDay){ for(let i=0;i<days;i++){const d=addDays(from,i);m.set(iso(d),{label:String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),value:0});} }
  else { const c=new Date(from.getFullYear(),from.getMonth(),1);
    while(c<=to){const k=c.getFullYear()+'-'+(c.getMonth()+1);m.set(k,{label:c.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'/'+String(c.getFullYear()).slice(2),value:0});c.setMonth(c.getMonth()+1);} }
  rows.forEach(r=>{const k=byDay?iso(r.date):r.date.getFullYear()+'-'+(r.date.getMonth()+1);const e=m.get(k);if(e)e.value+=valueFn(r)});
  return [...m.values()];
}

const REPORTS = {
  pedidos:{
    label:'Pedidos', title:'Pedidos do período', dated:true,
    statusKey:'status', statuses:['Concluído','Em andamento','Orçamento','Cancelado'], statusLabel:'Status',
    source:()=>ORDERS,
    cols:[{k:'num',l:'Nº'},{k:'date',l:'Data',f:fdate},{k:'cliente',l:'Cliente'},{k:'tipo',l:'Tipo'},{k:'status',l:'Status',b:1},{k:'valor',l:'Valor',f:brl,r:1}],
    kpis:(rows,prev)=>{
      const v=rows.filter(valid), pv=prev.filter(valid);
      const fat=sum(v,o=>o.valor), pfat=sum(pv,o=>o.valor);
      const canc=rows.filter(o=>o.status==='Cancelado').length;
      return [
        {l:'Faturamento',v:brl(fat),d:delta(fat,pfat),c:'#6d4aff'},
        {l:'Pedidos',v:rows.length,d:delta(rows.length,prev.length),c:'#2f7cf6'},
        {l:'Ticket médio',v:brl(v.length?fat/v.length:0),d:delta(v.length?fat/v.length:0,pv.length?pfat/pv.length:0),c:'#1fa971'},
        {l:'Cancelamentos',v:canc,d:rows.length?(canc/rows.length*100).toFixed(1).replace('.',',')+'% dos pedidos':'—',c:'#e5484d'}];
    },
    charts:(rows,from,to)=>[
      {type:'bars',title:'Faturamento ao longo do período',data:timeSeries(rows.filter(valid),o=>o.valor,from,to),fmt:brlShort},
      {type:'donut',title:'Pedidos por status',data:groupCount(rows,o=>o.status)}]
  },
  financeiro:{
    label:'Financeiro', title:'Movimentação financeira', dated:true,
    statusKey:'fin', statuses:['Pago','Parcial','Pendente','Atrasado','Cancelado'], statusLabel:'Situação',
    source:()=>ORDERS.filter(o=>o.status!=='Orçamento'),
    cols:[{k:'num',l:'Pedido'},{k:'date',l:'Data',f:fdate},{k:'cliente',l:'Cliente'},{k:'forma',l:'Forma pgto.'},{k:'fin',l:'Situação',b:1},{k:'valor',l:'Valor',f:brl,r:1}],
    kpis:(rows,prev)=>{
      const rec=rows.filter(o=>o.fin==='Pago'), prec=prev.filter(o=>o.fin==='Pago');
      const pend=rows.filter(o=>o.fin==='Pendente'||o.fin==='Parcial'), atr=rows.filter(o=>o.fin==='Atrasado');
      return [
        {l:'Recebido',v:brl(sum(rec,o=>o.valor)),d:delta(sum(rec,o=>o.valor),sum(prec,o=>o.valor)),c:'#1fa971'},
        {l:'A receber',v:brl(sum(pend,o=>o.valor)),d:pend.length+' lançamentos',c:'#e8a317'},
        {l:'Em atraso',v:brl(sum(atr,o=>o.valor)),d:atr.length+' lançamentos',c:'#e5484d'},
        {l:'Inadimplência',v:(rows.length?atr.length/rows.length*100:0).toFixed(1).replace('.',',')+'%',d:'sobre o total de lançamentos',c:'#6d4aff'}];
    },
    charts:(rows,from,to)=>[
      {type:'bars',title:'Recebimentos ao longo do período',data:timeSeries(rows.filter(o=>o.fin==='Pago'),o=>o.valor,from,to),fmt:brlShort},
      {type:'donut',title:'Valor por forma de pagamento',data:groupSum(rows,o=>o.forma,o=>o.valor),fmt:brlShort}]
  },
  entregas:{
    label:'Entregas', title:'Entregas e retiradas', dated:true,
    statusKey:'ent', statuses:['Concluída','Agendada','Em rota','Aguardando','Cancelada'], statusLabel:'Situação',
    source:()=>ORDERS.filter(o=>o.status!=='Orçamento'),
    cols:[{k:'num',l:'Pedido'},{k:'date',l:'Data',f:fdate},{k:'cliente',l:'Cliente'},{k:'bairro',l:'Bairro'},{k:'entTipo',l:'Operação'},{k:'ent',l:'Situação',b:1}],
    kpis:(rows,prev)=>{
      const ok=rows.filter(o=>o.ent==='Concluída'), ag=rows.filter(o=>o.ent==='Agendada'||o.ent==='Em rota');
      return [
        {l:'Total de operações',v:rows.length,d:delta(rows.length,prev.length),c:'#6d4aff'},
        {l:'Concluídas',v:ok.length,d:(rows.length?ok.length/rows.length*100:0).toFixed(0)+'% do total',c:'#1fa971'},
        {l:'Em andamento',v:ag.length,d:'agendadas ou em rota',c:'#2f7cf6'},
        {l:'Entregas / Retiradas',v:rows.filter(o=>o.entTipo==='Entrega').length+' / '+rows.filter(o=>o.entTipo==='Retirada').length,d:'no período',c:'#e8a317'}];
    },
    charts:(rows)=>[
      {type:'hbars',title:'Operações por bairro',data:groupCount(rows,o=>o.bairro).sort((a,b)=>b.value-a.value)},
      {type:'donut',title:'Situação das operações',data:groupCount(rows,o=>o.ent)}]
  },
  clientes:{
    label:'Clientes', title:'Ranking de clientes', dated:true,
    statusKey:null,
    source:(from,to)=>{
      const m={};
      ORDERS.filter(o=>valid(o)&&o.date>=from&&o.date<=to).forEach(o=>{
        const c=m[o.cliente]||(m[o.cliente]={cliente:o.cliente,tipo:o.cliTipo,pedidos:0,total:0,date:o.date});
        c.pedidos++;c.total+=o.valor;if(o.date>c.date)c.date=o.date;});
      return Object.values(m).sort((a,b)=>b.total-a.total);
    },
    prebuilt:true,
    cols:[{k:'cliente',l:'Cliente'},{k:'tipo',l:'Tipo'},{k:'pedidos',l:'Pedidos',r:1},{k:'total',l:'Total gasto',f:brl,r:1},{k:'date',l:'Último pedido',f:fdate}],
    kpis:(rows)=>{
      const t=sum(rows,c=>c.total);
      return [
        {l:'Clientes ativos',v:rows.length,d:'com pedidos no período',c:'#6d4aff'},
        {l:'Receita total',v:brl(t),d:'de clientes ativos',c:'#1fa971'},
        {l:'Média por cliente',v:brl(rows.length?t/rows.length:0),d:'no período',c:'#2f7cf6'},
        {l:'Cliente destaque',v:rows[0]?rows[0].cliente.split(' ').slice(0,2).join(' '):'—',d:rows[0]?brl(rows[0].total):'',c:'#ff5c8a'}];
    },
    charts:(rows)=>[
      {type:'hbars',title:'Top 8 clientes por valor',data:rows.slice(0,8).map(c=>({label:c.cliente,value:c.total})),fmt:brl},
      {type:'donut',title:'Pessoa física x jurídica',data:groupCount(rows,c=>c.tipo==='PF'?'Pessoa física':'Pessoa jurídica')}]
  },
  estoque:{
    label:'Estoque', title:'Posição de estoque', dated:false,
    statusKey:'situacao', statuses:['Disponível','Estoque baixo','Esgotado'], statusLabel:'Situação',
    source:()=>PRODUTOS.map(p=>{const disp=p.estoque-p.alugados;const pct=disp/p.estoque;
      return {...p,disp,situacao:disp===0?'Esgotado':pct<.3?'Estoque baixo':'Disponível'}}),
    cols:[{k:'nome',l:'Produto'},{k:'categoria',l:'Categoria'},{k:'estoque',l:'Total',r:1},{k:'alugados',l:'Alugados',r:1},{k:'disp',l:'Disponível',r:1},{k:'preco',l:'Locação (diária)',f:brl,r:1},{k:'situacao',l:'Situação',b:1}],
    kpis:(rows)=>{
      const tot=sum(rows,p=>p.estoque), al=sum(rows,p=>p.alugados);
      return [
        {l:'Itens cadastrados',v:rows.length,d:tot+' unidades no total',c:'#6d4aff'},
        {l:'Unidades alugadas',v:al,d:(tot?al/tot*100:0).toFixed(0)+'% do estoque',c:'#2f7cf6'},
        {l:'Estoque baixo',v:rows.filter(p=>p.situacao==='Estoque baixo').length,d:'abaixo de 30% disponível',c:'#e8a317'},
        {l:'Valor em estoque',v:brl(sum(rows,p=>p.estoque*p.preco)),d:'diária × unidades',c:'#1fa971'}];
    },
    charts:(rows)=>[
      {type:'hbars',title:'Itens mais alugados agora',data:[...rows].sort((a,b)=>b.alugados-a.alugados).slice(0,8).map(p=>({label:p.nome,value:p.alugados}))},
      {type:'donut',title:'Unidades por categoria',data:groupSum(rows,p=>p.categoria,p=>p.estoque)}]
  }
};

function delta(cur,prev){
  if(!prev) return 'sem período anterior';
  const p=(cur-prev)/prev*100;
  return `<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1).replace('.',',')}%</span> vs. período anterior`;
}

/* ============ Estado e renderização ============ */
const state={tab:'pedidos',from:addDays(HOJE,-89),to:HOJE,status:'',q:'',sort:null,dir:1,page:1,size:10,chip:90};
let currentRows=[], currentDef=null;

function setRange(days){
  state.to=HOJE; state.from=days==='mes'?new Date(HOJE.getFullYear(),HOJE.getMonth(),1):addDays(HOJE,-(days-1));
  state.chip=days; syncInputs(); state.page=1; render();
}
function syncInputs(){
  $('#from').value=iso(state.from); $('#to').value=iso(state.to);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',String(c.dataset.d)===String(state.chip)));
}

function buildStatic(){
  $('#tabs').innerHTML=Object.entries(REPORTS).map(([k,r])=>`<button class="tab" data-k="${k}">${r.label}</button>`).join('');
  $('#chips').innerHTML=[[7,'7 dias'],[30,'30 dias'],['mes','Este mês'],[90,'90 dias'],[365,'12 meses']]
    .map(([d,l])=>`<button class="chip" data-d="${d}">${l}</button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;state.tab=b.dataset.k;state.status='';state.sort=null;state.page=1;render();};
  $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const d=b.dataset.d;setRange(d==='mes'?'mes':+d);};
  $('#from').onchange=e=>{state.from=parseIso(e.target.value);state.chip=null;state.page=1;syncInputs();render();};
  $('#to').onchange=e=>{state.to=parseIso(e.target.value);state.chip=null;state.page=1;syncInputs();render();};
  $('#status').onchange=e=>{state.status=e.target.value;state.page=1;render();};
  $('#q').oninput=e=>{state.q=e.target.value.trim().toLowerCase();state.page=1;render();};
  $('#thead').onclick=e=>{const th=e.target.closest('th');if(!th)return;const k=th.dataset.k;
    if(state.sort===k)state.dir*=-1;else{state.sort=k;state.dir=1;} render();};
  $('#prev').onclick=()=>{state.page--;render();};
  $('#next').onclick=()=>{state.page++;render();};
  $('#btnCsv').onclick=exportCsv;
  $('#btnPrint').onclick=()=>window.print();
  $('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
}

function rowsFor(def,from,to){
  let rows=def.source(from,to);
  if(def.dated&&!def.prebuilt) rows=rows.filter(o=>o.date>=from&&o.date<=to);
  return rows;
}

function render(){
  const def=REPORTS[state.tab]; currentDef=def;
  if(state.from>state.to){const t=state.from;state.from=state.to;state.to=t;syncInputs();}
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.k===state.tab));

  // Filtros
  const st=$('#status');
  if(def.statusKey){
    st.disabled=false; $('#statusLabel').textContent=def.statusLabel;
    st.innerHTML='<option value="">Todos</option>'+def.statuses.map(s=>`<option ${s===state.status?'selected':''}>${s}</option>`).join('');
  } else { st.disabled=true; st.innerHTML='<option>—</option>'; }
  const dateInputs=[$('#from'),$('#to')]; dateInputs.forEach(i=>i.disabled=!def.dated);
  document.querySelectorAll('.chip').forEach(c=>c.disabled=!def.dated);
  const note=$('#note'); note.style.display=def.dated?'none':'block';
  note.textContent='Este relatório mostra a posição atual do estoque e não depende do período selecionado.';

  // Dados
  const span=Math.round((state.to-state.from)/864e5)+1;
  const prevTo=addDays(state.from,-1), prevFrom=addDays(prevTo,-(span-1));
  const base=rowsFor(def,state.from,state.to);
  const prevRows=def.dated?rowsFor(def,prevFrom,prevTo):[];
  let rows=base;
  if(def.statusKey&&state.status) rows=rows.filter(r=>r[def.statusKey]===state.status);
  if(state.q) rows=rows.filter(r=>def.cols.some(c=>String(c.f?c.f(r[c.k]):r[c.k]).toLowerCase().includes(state.q))||String(r.num||'').includes(state.q));
  currentRows=rows;

  $('#subtitle').textContent=def.dated?`${def.label} · ${fdate(state.from)} a ${fdate(state.to)}`:`${def.label} · posição atual`;
  $('#printHead').textContent=`Fest — Relatório de ${def.label} · gerado em ${new Date().toLocaleString('pt-BR')}`;

  // KPIs
  $('#kpis').innerHTML=def.kpis(rows,prevRows).map(k=>`<div class="kpi" style="--c:${k.c}"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="d">${k.d}</div></div>`).join('');

  // Gráficos
  const ch=def.charts(rows,state.from,state.to);
  $('#charts').innerHTML=ch.map(c=>`<div class="card"><h3>${c.title}</h3>${chartHtml(c)}</div>`).join('');

  // Tabela
  const sorted=[...rows];
  if(state.sort){const k=state.sort;sorted.sort((a,b)=>{const x=a[k],y=b[k];return (x>y?1:x<y?-1:0)*state.dir;});}
  const pages=Math.max(1,Math.ceil(sorted.length/state.size)); state.page=Math.min(state.page,pages);
  const slice=sorted.slice((state.page-1)*state.size,state.page*state.size);
  $('#tableTitle').textContent=def.title;
  $('#count').textContent=`${rows.length} registro${rows.length===1?'':'s'}`;
  $('#thead').innerHTML='<tr>'+def.cols.map(c=>`<th data-k="${c.k}" class="${c.r?'r':''}">${c.l}<span class="ar">${state.sort===c.k?(state.dir>0?'▲':'▼'):'↕'}</span></th>`).join('')+'</tr>';
  $('#tbody').innerHTML=slice.length?slice.map(r=>'<tr>'+def.cols.map(c=>{
    const raw=r[c.k], txt=c.f?c.f(raw):raw;
    return `<td class="${c.r?'r':''}">${c.b?badge(txt):txt}</td>`;}).join('')+'</tr>').join('')
    :`<tr><td colspan="${def.cols.length}" class="empty">Nenhum registro encontrado para os filtros selecionados.</td></tr>`;
  $('#pageInfo').textContent=`Página ${state.page} de ${pages}`;
  $('#prev').disabled=state.page<=1; $('#next').disabled=state.page>=pages;
}

function chartHtml(c){
  const data=c.data, fmt=c.fmt||(v=>v);
  if(!data.length||data.every(d=>!d.value)) return '<div class="empty">Sem dados para o período.</div>';
  if(c.type==='bars'){
    const max=Math.max(...data.map(d=>d.value))||1, step=Math.ceil(data.length/10);
    return '<div class="bars">'+data.map((d,i)=>`<div class="bar"><div style="height:${d.value/max*100}%" title="${d.label}: ${fmt(d.value)}"></div><small>${i%step===0?d.label:''}</small></div>`).join('')+'</div>';
  }
  if(c.type==='donut'){
    const total=sum(data,d=>d.value); let acc=0;
    const grad=data.map((d,i)=>{const s=acc/total*100;acc+=d.value;return `${COLORS[i%COLORS.length]} ${s}% ${acc/total*100}%`}).join(',');
    return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${grad})" data-total="${c.fmt?fmt(total):total}"></div>
      <div class="legend">${data.map((d,i)=>`<div><i style="background:${COLORS[i%COLORS.length]}"></i>${d.label}<b>${c.fmt?fmt(d.value):d.value}</b></div>`).join('')}</div></div>`;
  }
  const max=Math.max(...data.map(d=>d.value))||1;
  return '<div class="hbars">'+data.map(d=>`<div class="hbar"><div class="t"><span>${d.label}</span><b>${fmt(d.value)}</b></div><div class="tr"><div style="width:${d.value/max*100}%"></div></div></div>`).join('')+'</div>';
}

function exportCsv(){
  const def=currentDef;
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[def.cols.map(c=>esc(c.l)).join(';')];
  currentRows.forEach(r=>lines.push(def.cols.map(c=>esc(c.f?c.f(r[c.k]):r[c.k])).join(';')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`relatorio-${state.tab}-${iso(HOJE)}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

buildStatic(); setRange(90);
</script>
